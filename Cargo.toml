# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — doc/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-core-transport-sftp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-sftp"
description = "SFTP transport: the SSH file transfer protocol over an SSH session; a Receive Location lists and reads, a Send Location writes. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). SFTP rides on SSH over TCP, so the tcp technology is
# the carrier the manifest declares: the far end binds through it.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
tcp = { package = "xmip-core-transport-tcp", git = "https://github.com/IlleNilsson/xmip-core-transport-tcp", branch = "main" }
# The names the peer's key, user, signature and session travel under, which
# the identity gates read (context::property).
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
# The key a Send Location authenticates with, and the far end's host key.
ed25519-dalek = "2"
# The estate's encoding primitives: the byte cursor and writer the SFTP
# packets are built from, and the base 64 a signature rides in.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# SSH: the wire types, the transport layer, user authentication and the
# session channel the SFTP subsystem runs over.
ssh = { package = "xmip-core-library-ssh", git = "https://github.com/IlleNilsson/xmip-core-library-ssh", branch = "main" }
# The most one file is read or held whole (`net::MAX_BODY`), and the one
# refusal of a size over it (`net::ceiling`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test support
# and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
