[package]
name = "xmip-core-transport-sftp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-sftp"
description = "SFTP transport: the SSH file transfer protocol over an SSH session; a Receive Location lists and reads, a Send Location writes. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). SFTP rides on SSH over TCP, so the tcp technology is
# the carrier the manifest declares: the far end binds through it. Its
# declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26), and the one clock
# (xcore::Clock) a write's time is read from.
xcore = { workspace = true }
tcp = { workspace = true, optional = true }
# The names the peer's key, user, signature and session travel under, which
# the identity gates read (context::property).
context = { workspace = true, optional = true }
# The key a Send Location authenticates with, and the far end's host key.
ed25519-dalek = { version = "3", optional = true }
# The estate's encoding primitives: the byte cursor and writer the SFTP
# packets are built from, and the base 64 a signature rides in.
codec = { workspace = true, optional = true }
# SSH: the wire types, the transport layer, user authentication and the
# session channel the SFTP subsystem runs over.
ssh = { workspace = true, optional = true }
# The most one file is read or held whole (`net::MAX_BODY`), and the one
# refusal of a size over it (`net::ceiling`).
net = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = [
    "declaration",
    "dep:tcp",
    "dep:context",
    "dep:ed25519-dalek",
    "dep:codec",
    "dep:ssh",
    "dep:net",
]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test support
# and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
